<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Noszvaj és környéke</title>
<meta name="description" content="Válasszuk ki közösen a noszvaji utazás programjait." />
<meta name="theme-color" content="#ffffff" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================================================
     NÉVVÁLASZTÓ — első megnyitáskor jelenik meg, amíg nincs
     localStorage-ban mentett felhasználónév.
     ============================================================ -->
<div id="name-select-overlay" class="name-select-overlay">
  <div class="name-select-card">
    <div class="logo" id="name-select-logo"></div>
    <h1>Noszvaj és környéke</h1>
    <p>Válaszd ki a neved a folytatáshoz</p>
    <div class="name-select-list" id="name-select-list"><!-- JS tölti fel --></div>
  </div>
</div>

<!-- ============================================================
     FŐ ALKALMAZÁS
     ============================================================ -->
<div id="app" class="app hidden">

  <header class="header">
    <div class="header-content">
      <div class="logo" id="header-logo"></div>
      <h1 class="app-title">Noszvaj és környéke</h1>
    </div>
  </header>

  <nav class="category-bar" id="category-bar" aria-label="Kategóriák"><!-- JS tölti fel --></nav>

  <div class="sort-bar">
    <div class="sort-control">
      <label for="sort-select">Rendezés:</label>
      <div class="select-wrapper">
        <select id="sort-select" aria-label="Rendezés módja"><!-- JS tölti fel --></select>
      </div>
    </div>
    <button
      id="sort-direction-btn"
      class="sort-direction-btn"
      type="button"
      aria-label="Rendezési sorrend megfordítása"
      aria-pressed="false"
    ></button>
  </div>

  <!-- PROGRAMOK nézet -->
  <main class="program-list" id="program-list" aria-live="polite"><!-- JS tölti fel --></main>

  <!-- Placeholder nézetek: Kedvencek / Tervezett / Menü -->
  <section id="placeholder-view" class="placeholder-view hidden"></section>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Fő navigáció">
    <button class="bottom-nav-item is-active" data-view="programok" type="button">
      <span class="bn-icon"></span>Programok
    </button>
    <button class="bottom-nav-item" data-view="kedvencek" type="button">
      <span class="bn-icon"></span>Kedvencek
    </button>
    <button class="bottom-nav-item" data-view="tervezett" type="button">
      <span class="bn-icon"></span>Tervezett
    </button>
    <button class="bottom-nav-item" data-view="menu" type="button">
      <span class="bn-icon"></span>Menü
    </button>
  </nav>
</div>

<!-- ============================================================
     RÉSZLETES NÉZET (bottom sheet mobilon / modal desktopon)
     ============================================================ -->
<div id="detail-sheet" class="detail-sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet-panel" id="sheet-panel">
    <button class="sheet-close" id="sheet-close" type="button" aria-label="Bezárás"></button>
    <div id="sheet-body"><!-- JS tölti fel --></div>
  </div>
</div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
