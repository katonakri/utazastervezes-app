(function () {
  try {
    var savedUser = localStorage.getItem('noszvaj_current_user');
    var validUsers = ['Deli', 'Peti', 'Ármin', 'Tina', 'Kristóf'];

      document.documentElement.classList.add('has-saved-user');

  } catch (e) {}
})();
</script>
